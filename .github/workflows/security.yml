name: Security & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
          pip install aiosqlite  # needed for test DB

      - name: Run tests
        run: |
          cd backend
          pytest tests/ -v --tb=short

  sast-bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Bandit SAST
        run: |
          pip install bandit
          bandit -r backend/app/ -ll -f json -o bandit-report.json || true
          bandit -r backend/app/ -ll

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for vulnerable dependencies
        run: |
          pip install safety
          safety check -r backend/requirements.txt || true
