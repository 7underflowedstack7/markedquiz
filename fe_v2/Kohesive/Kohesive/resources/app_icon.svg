<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#221712"/>
      <stop offset="100%" stop-color="#0D0907"/>
    </radialGradient>
    <!-- Ember glow -->
    <radialGradient id="ember-glow" cx="50%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#C4582A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#C4582A" stop-opacity="0"/>
    </radialGradient>
    <!-- K letter gradient -->
    <linearGradient id="k-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4582A"/>
      <stop offset="100%" stop-color="#C6A27A"/>
    </linearGradient>
    <!-- Ring gradient -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4582A" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#C6A27A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C4582A" stop-opacity="0.6"/>
    </linearGradient>
    <!-- Inner ring glow -->
    <linearGradient id="inner-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4582A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#C6A27A" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Ambient glow behind the letter -->
  <circle cx="512" cy="490" r="320" fill="url(#ember-glow)"/>

  <!-- Outer decorative ring -->
  <circle cx="512" cy="512" r="380" fill="none" stroke="url(#ring-grad)" stroke-width="1.5"/>

  <!-- Inner decorative ring -->
  <circle cx="512" cy="512" r="320" fill="none" stroke="url(#inner-ring)" stroke-width="1"/>

  <!-- Stylized K letterform — geometric, modern -->
  <!-- Vertical stroke -->
  <rect x="358" y="300" width="52" height="424" rx="26" fill="url(#k-grad)"/>

  <!-- Upper diagonal -->
  <rect x="410" y="300" width="52" height="280" rx="26" fill="url(#k-grad)" transform="rotate(32, 410, 300)"/>

  <!-- Lower diagonal -->
  <rect x="410" y="444" width="52" height="300" rx="26" fill="url(#k-grad)" transform="rotate(-32, 410, 724)"/>

  <!-- Small accent dot -->
  <circle cx="660" cy="360" r="18" fill="#C4582A" opacity="0.7"/>

  <!-- Subtle grain texture dots -->
  <circle cx="200" cy="180" r="1" fill="#F5ECDD" opacity="0.03"/>
  <circle cx="800" cy="250" r="1" fill="#F5ECDD" opacity="0.04"/>
  <circle cx="300" cy="800" r="1" fill="#F5ECDD" opacity="0.03"/>
  <circle cx="700" cy="750" r="1" fill="#F5ECDD" opacity="0.04"/>
  <circle cx="150" cy="500" r="1" fill="#F5ECDD" opacity="0.03"/>
  <circle cx="850" cy="600" r="1" fill="#F5ECDD" opacity="0.04"/>
</svg>
