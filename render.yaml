services:
  - type: web
    name: markedquiz
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python prestart.py && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: markedquiz-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://markedquiz.onrender.com
      - key: PYTHON_VERSION
        value: "3.12.3"

databases:
  - name: markedquiz-db
    plan: free
